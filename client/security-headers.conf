# Included at server level and in every location that sets its own add_header
# (a location's add_header replaces the inherited set instead of adding to it).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browsers ignore this over plain HTTP; it takes effect once served through the TLS proxy.
add_header Strict-Transport-Security "max-age=31536000" always;
# Report-only first: watch the browser console for violations, then switch to enforcing.
# Third parties: Stripe.js checkout, YouTube embed on the landing page, Unsplash and
# placeholder images on blog pages. 'unsafe-inline' styles: React style props and Stripe Elements.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://via.placeholder.com https://*.stripe.com; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://api.stripe.com; frame-src https://js.stripe.com https://hooks.stripe.com https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
