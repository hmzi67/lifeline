server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    server_tokens off;

    # Vite fingerprints everything under /assets/, so a file never changes at the same URL.
    # (add_header in a location replaces the server-level headers, so they are included again.)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # index.html points at the current hashed bundles; revalidate it on every visit.
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Handle API requests - proxy to API service
    location /api/ {
        # nginx's default 1MB body limit rejected photo and video uploads with 413 before
        # they reached the API. The API allows admin media up to 100MB; the extra room is
        # for multipart overhead, so the API's own clearer size error is what users see.
        client_max_body_size 110m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers (shared with the locations above; see security-headers.conf)
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
