server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Vite fingerprints everything under /assets/, so a file never changes at the same URL.
    # (add_header in a location replaces the server-level headers, so they are repeated here.)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # index.html points at the current hashed bundles; revalidate it on every visit.
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Handle API requests - proxy to API service
    location /api/ {
        # nginx's default 1MB body limit rejected photo and video uploads with 413 before
        # they reached the API; match the API's own 200MB upload limit.
        client_max_body_size 200m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
