# Included at server level and in every location that sets its own add_header
# (a location's add_header replaces the inherited set instead of adding to it).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browsers ignore this over plain HTTP; it takes effect once served through the TLS proxy.
add_header Strict-Transport-Security "max-age=31536000" always;
# Report-only first: watch the browser console for violations, then switch to enforcing.
# The admin panel loads no third parties; media previews come from the API's /uploads.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
